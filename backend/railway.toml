[build]
  builder = "dockerfile"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "./fstorage-api"
  healthcheckPath = "/health"
  healthcheckTimeout = 300

[variables]
  DB_DRIVER = "mysql"
  DB_PORT = "3306"
  DB_NAME = "railway"
  PORT = "8080"
  GIN_MODE = "release"
  JWT_SECRET = "inflashstory-production-secret-2026"
  ADMIN_USERNAME = "admin"
  ADMIN_PASSWORD = "admin123"